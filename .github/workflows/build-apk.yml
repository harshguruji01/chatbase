name: Build Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ChatBase APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Production Bundle
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build APK with Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatBase-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare Release APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/chatbase.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "ChatBase APK v1.0.0 (VIP Premium Edition)"
          body: |
            ### 🚀 ChatBase Android APK - VIP Premium Edition
            
            **What's New in this Build:**
            - 👑 **ChatBase VIP Membership Hub**: Gold prestige badges, membership management, and tier selection.
            - 🚫 **100% Ad-Free**: Ad banners, sponsored feed posts, and interstitial popups suppressed for VIP users.
            - ⚡ **Unlimited GuruJi AI Copilot**: Unlimited messages with high-speed priority responses.
            - 👻 **Ghost Incognito Radar**: Scan nearby users privately without revealing GPS location.
            - 🧭 **150km Proximity Booster**: Extended nearby radar scanner.
            - 🎨 **Exclusive VIP Themes & Wallpapers**: Cosmic Galaxy, Emerald Aurora, Luxury Velvet Gold, and Cyberpunk Neon.
            - 🎁 **VIP Promo Code Redemption** (e.g. `CHATBASEVIP`, `GOLD2026`, `PREMIUM`).
          files: android/app/build/outputs/apk/debug/chatbase.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

